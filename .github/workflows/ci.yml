name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Validate artifacts
        run: python scripts/validate_package.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Compile modules
        run: python -m py_compile magnificabench_chapter2/*.py scripts/validate_package.py tests/test_cli_smoke.py
      - name: Installed package smoke run outside checkout
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          python -m magnificabench_chapter2 validate
          python -m magnificabench_chapter2 run --answer-provider demo --judge heuristic --limit 2 --out-dir smoke
