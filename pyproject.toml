[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnificabench-chapter2"
version = "0.2.1"
description = "Runnable MagnificaBench Chapter 2 benchmark slice with dataset, rubric, CLI, and LLM judge workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "MagnificaBench Chapter 2 contributors" }
]
keywords = ["benchmark", "llm-evaluation", "ai-governance", "dataset", "magnificabench"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/hanzhenzhujene/magnificabench-chapter2"
Documentation = "https://github.com/hanzhenzhujene/magnificabench-chapter2/blob/main/docs/RUN_BENCHMARK.md"
Issues = "https://github.com/hanzhenzhujene/magnificabench-chapter2/issues"

[project.scripts]
magnificabench-ch2 = "magnificabench_chapter2.cli:main"

[tool.setuptools.packages.find]
include = ["magnificabench_chapter2*"]

[tool.setuptools.package-data]
magnificabench_chapter2 = ["resources/*"]
